<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>货物托运单管理 - 厦门聚富塑胶</title>
<style>
  :root{
    --blue:#185FA5; --blue-d:#0C447C; --green:#3B6D11; --red:#A32D2D;
    --amber:#854F0B; --ink:#1f2329; --muted:#6b7280; --line:#e5e7eb;
    --bg:#f5f6f8; --card:#ffffff; --soft:#eef3f9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
  header{background:linear-gradient(135deg,var(--blue-d),var(--blue));color:#fff;padding:20px 16px 16px;border-radius:0 0 16px 16px;box-shadow:0 4px 16px rgba(24,95,165,.18)}
  header h1{font-size:19px;font-weight:600}
  header p{font-size:12px;opacity:.85;margin-top:2px}
  .tabs{display:flex;gap:6px;margin:18px 0 14px}
  .tab{flex:1;text-align:center;padding:10px 4px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;color:var(--muted);user-select:none}
  .tab.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:500}
  .view{display:none}
  .view.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filters input[type=date],.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
  .btn{border:none;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:500}
  .btn-p{background:var(--blue);color:#fff}
  .btn-g{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .btn-ok{background:var(--green);color:#fff}
  .btn-no{background:#fff;color:var(--red);border:1px solid var(--red)}
  .btn-del{background:#fff;color:var(--muted);border:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .no{font-weight:600;color:var(--blue-d)}
  .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .meta b{color:var(--ink);font-weight:500}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
  .b-pending{background:#FAC775;color:#633806}
  .b-done{background:#C0DD97;color:#27500A}
  .b-reject{background:#F7C1C1;color:#791F1F}
  .ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .ops .btn{padding:6px 11px;font-size:13px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .field label .req{color:#D4380D;font-weight:700}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .field textarea{resize:vertical;min-height:60px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .calc{background:var(--soft);border-radius:10px;padding:12px 14px;margin:6px 0 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .calc .amt{font-size:20px;color:var(--blue-d);font-weight:600}
  .title-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .title-bar h2{font-size:16px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  .tip{font-size:12px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.on{display:flex}
  .modal-box{background:#fff;border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:20px}
  .modal-box h3{font-size:17px;margin-bottom:14px}
  .modal-ops{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .paper{background:#fff;color:#000;padding:8px;font-family:"SimSun","宋体",serif;font-size:12px;line-height:1.4}
  .sheet{display:flex}
  .cols{flex:1;min-width:0}
  .side{width:24px;border:1px solid #000;border-left:none;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1.6;text-align:center;word-break:break-all;padding:4px 3px;letter-spacing:1px}
  .ptop{display:flex;align-items:center;border:1px solid #000;border-bottom:none;padding:4px 8px;min-height:66px}
  .plogo{width:50px;height:50px;border:2px solid #173a6b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Arial;font-size:19px;font-weight:700;color:#173a6b;flex-shrink:0}
  .pco{flex:1;text-align:center;min-width:0}
  .pco .cn{font-size:17px;font-weight:700;letter-spacing:2px}
  .pco .en{font-size:9px;letter-spacing:1px;white-space:nowrap}
  .pqr{width:60px;height:60px;flex-shrink:0;margin:0 8px}
  .pqr svg{width:100%;height:100%;display:block}
  .pstat{font-size:11px;line-height:1.9;flex-shrink:0}
  .pstat u{background:#ffe600;text-decoration:none;padding:0 2px}
  .ptitle{text-align:center;font-size:20px;font-weight:700;letter-spacing:8px;border:1px solid #000;border-bottom:none;padding:2px 0 4px;position:relative}
  .ptitle .pno{position:absolute;right:8px;bottom:5px;font-size:11px;font-weight:400;letter-spacing:0}
  table.pw{width:100%;border-collapse:collapse;table-layout:fixed}
  table.pw td{border:1px solid #000;padding:3px 5px;font-size:11px;vertical-align:middle;min-height:20px;overflow-wrap:break-word}
  td.lb{background:#fafafa;font-weight:600;white-space:nowrap}
  .pbig{font-size:13px;font-weight:700}
  .ptotal{color:#A32D2D;font-weight:700;font-size:13px}
  .pterms{font-size:11px;line-height:1.45}
  .paccept{font-size:11px;line-height:1.8}
  .psign{border:1px solid #000;border-top:none;padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  table.pt{width:100%;border-collapse:collapse;margin-top:8px}
  table.pt td,table.pt th{border:1px solid #333;padding:6px 8px;font-size:12px}
  table.pt th{background:#f0f0f0;font-weight:600;width:90px;text-align:left}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}.calc .amt{font-size:17px}.pqr{width:46px;height:46px;margin:0 4px}.pco .cn{font-size:13px}.pco .en{font-size:7px}.pstat{font-size:9px}}
  @media print{@page{size:A4 landscape;margin:8mm}header,.tabs,.filters,.ops,.title-bar .btn,.modal-ops,.tip,.modal-box h3{display:none!important}body{background:#fff}.modal{position:static;background:#fff;padding:0;display:block}.modal-box{max-width:none;padding:0;box-shadow:none}.paper{border:none;padding:0}}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>货物托运单管理</h1>
    <p>厦门聚富塑胶制品有限公司 · 审批通过后自动生成托运单</p>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <div class="tab on" data-v="list">单据列表</div>
    <div class="tab" data-v="new">新建托运单</div>
    <div class="tab" data-v="export">查询导出</div>
  </div>

  <!-- 列表 -->
  <section class="view on" id="v-list">
    <div class="filters">
      <select id="f-status">
        <option value="all">全部状态</option>
        <option value="pending">待审批</option>
        <option value="done">已通过</option>
        <option value="reject">已驳回</option>
      </select>
      <input type="date" id="f-start" title="开始日期">
      <input type="date" id="f-end" title="结束日期">
      <button class="btn btn-g" onclick="renderList()">筛选</button>
      <button class="btn btn-g" onclick="loadState().then(renderList)">刷新</button>
    </div>
    <div id="listBox"></div>
  </section>

  <!-- 新建 -->
  <section class="view" id="v-new">
    <div class="tip">说明：提交后状态为「待审批」，在单据列表点「通过」后即生成正式托运单编号与单据。</div>
    <details class="card" style="margin-bottom:12px">
      <summary style="cursor:pointer;font-weight:500;color:var(--blue-d)">公司抬头设置（打印抬头，点开修改）</summary>
      <div style="margin-top:12px">
        <div class="grid2">
          <div class="field"><label>公司中文名（打印抬头）</label><input id="coCn" oninput="autoFillEn()" placeholder="输入中文名，英文名会自动带出"></div>
          <div class="field"><label>公司英文名</label><input id="coEn" placeholder="自动生成，可手动改成官方英文名"></div>
          <div class="field"><label>标志文字（左圆标内）</label><input id="coLogo"></div>
        </div>
        <button class="btn btn-g" onclick="saveCompany()">保存抬头</button>
        <div class="meta" style="margin-top:8px">改完点保存，之后打印的托运单都用新抬头。</div>
      </div>
    </details>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>承运单位 <span class="req">*</span></label><input id="carrier" placeholder="如：鑫展望"></div>
        <div class="field"><label>制单人 <span class="req">*</span></label><input id="maker" placeholder="填你自己的名字"></div>
        <div class="field"><label>经办人</label><input id="handler"></div>
        <div class="field"><label>经办人联系电话</label><input id="handlerPhone"></div>
        <div class="field"><label>配送方式</label><input id="delivery" value="送货上门"></div>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:4px 0 14px">
      <div class="grid2">
        <div class="field"><label>司机姓名</label><input id="driverName"></div>
        <div class="field"><label>司机身份证号</label><input id="driverId"></div>
        <div class="field"><label>司机电话</label><input id="driverPhone"></div>
        <div class="field"><label>车牌号码</label><input id="plateNo"></div>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:4px 0 14px">
      <div class="grid2">
        <div class="field"><label>货物名 <span class="req">*</span></label><input id="gname" placeholder="如：缠绕膜"></div>
        <div class="field"><label>运费单价（元/吨）<span class="req">*</span></label><input id="price" type="number" step="0.01" placeholder="350"></div>
        <div class="field"><label>数量（吨）<span class="req">*</span></label><input id="qty" type="number" step="0.01" placeholder="5.5"></div>
        <div class="field"><label>送达时间</label><input id="deliveryTime" placeholder="如：2026-11-20"></div>
        <div class="field"><label>备注（数量）</label><input id="gremark" placeholder="如：5"></div>
        <div class="field"><label>备注（单位）</label><input id="gunit" value="（托）"></div>
        <div class="field"><label>客户行数</label><input id="customerCount" type="number" value="830"></div>
        <div class="field"><label>发货行数</label><input id="shipmentCount" type="number" value="3414"></div>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:4px 0 14px">
      <div class="field"><label>收货单位 <span class="req">*</span></label><input id="rcompany" placeholder="如：华昊无纺布有限公司"></div>
      <div class="grid2">
        <div class="field"><label>联系人 <span class="req">*</span></label><input id="rcontact" placeholder="如：洪东财"></div>
        <div class="field"><label>联系电话 <span class="req">*</span></label><input id="rphone" placeholder="如：18815295876"></div>
      </div>
      <div class="field"><label>收货地址 <span class="req">*</span></label><textarea id="raddress" placeholder="省市区街道门牌号"></textarea></div>

      <div class="calc">
        <div>运费合计 <span class="amt" id="amountShow">¥0.00</span></div>
        <div style="color:var(--muted);font-size:13px" id="cnShow">零元整</div>
      </div>
      <button class="btn btn-p" style="width:100%;padding:12px" onclick="submitNew()">提交审批</button>
    </div>
  </section>

  <!-- 导出 -->
  <section class="view" id="v-export">
    <div class="card">
      <div class="title-bar"><h2>按时间导出货运单</h2></div>
      <div class="filters">
        <input type="date" id="e-start">
        <input type="date" id="e-end">
      </div>
      <div class="ops" style="margin-top:4px">
        <button class="btn btn-p" onclick="exportCSV()">导出 CSV（Excel 可打开）</button>
        <button class="btn btn-g" onclick="exportPrint()">打印汇总表</button>
      </div>
      <div id="exportStat" class="meta" style="margin-top:12px"></div>
    </div>
  </section>
</div>

<!-- 托运单预览弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">托运单预览</h3>
    <div id="printTip" style="display:none;background:#FAC775;color:#633806;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px">此单还在待审批，审批通过后才能打印。</div>
    <div id="paperBox"></div>
    <div class="modal-ops">
      <button class="btn btn-del" onclick="closeModal()">关闭</button>
      <button class="btn btn-p" id="printBtn" onclick="window.print()">打印 / 存为PDF</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_COMPANY={cn:'厦门聚富塑胶制品有限公司',en:'XIAMEN JUFU PLASTIC PRODUCTS CO., LTD',logo:'GF'};
const DEFAULT_DICT={'厦门聚富塑胶制品有限公司':'XIAMEN JUFU PLASTIC PRODUCTS CO., LTD'};
// 共享模式：数据统一存服务端，所有人可见
let DATA=[], COMPANY=Object.assign({},DEFAULT_COMPANY), CDICT=Object.assign({},DEFAULT_DICT);

// 从服务端加载最新状态
async function loadState(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});
    const s=await r.json();
    DATA=s.waybills||[];
    COMPANY=Object.assign({},DEFAULT_COMPANY,s.company||{});
    CDICT=Object.assign({},DEFAULT_DICT,s.dict||{});
  }catch(e){
    console.error('加载共享数据失败',e);
  }
}
// 把服务端返回的新状态应用到本地
function applyState(s){
  if(!s)return;
  DATA=s.waybills||DATA;
  COMPANY=Object.assign({},DEFAULT_COMPANY,s.company||COMPANY);
  CDICT=Object.assign({},DEFAULT_DICT,s.dict||CDICT);
}

const PYMAP={};PY_TOKENS.forEach(t=>{const i=t.indexOf(':');if(i>0)PYMAP[t.slice(0,i)]=t.slice(i+1);});

// 公司常用词 → 英文（长词在前）
const WORDS=[
  ['股份有限公司','CO., LTD.'],['有限责任公司','CO., LTD.'],['有限公司','CO., LTD.'],
  ['厦门','XIAMEN'],['上海','SHANGHAI'],['广州','GUANGZHOU'],['北京','BEIJING'],

// 中文名 → 英文（词表优先，其余按拼音）
function cnToEn(cn){
  let out='',i=0;
  while(i<cn.length){
    let matched=false;
    for(const [w,en] of WORDS){
      if(cn.startsWith(w,i)){out+=' '+en+' ';i+=w.length;matched=true;break;}
    }
    if(matched)continue;
    const ch=cn[i];
    if(/[\u4e00-\u9fa5]/.test(ch)){
      out+=' '+(PYMAP[ch]?PYMAP[ch].toUpperCase():ch)+' ';
    }else{
      out+=ch;
    }
    i++;
  }
  return out.replace(/\s+/g,' ').trim().toUpperCase();
}

function uid(){return 'wb_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(d){const x=new Date(d);return x.toLocaleString('zh-CN',{hour12:false});}
function fmtNo(n){return '¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}

// 数字转中文大写
const CN='零壹贰叁肆伍陆柒捌玖', U=['','拾','佰','仟'], BIG=['','万','亿'];
function sec(n){let s='',z=false;for(let i=3;i>=0;i--){const d=Math.floor(n/Math.pow(10,i))%10;if(d===0){if(s)z=true;}else{if(z){s+='零';z=false;}s+=CN[d]+U[i];}}return s;}
function intCN(n){if(n===0)return '零';let g=[];while(n>0){g.push(n%10000);n=Math.floor(n/10000);}let p=[];for(let i=g.length-1;i>=0;i--){const v=g[i];if(v===0){if(p.length)p.push('零');}else{p.push(sec(v)+BIG[i]);}}return p.join('').replace(/零+/g,'零').replace(/零$/,'')||'零';}
function moneyCN(n){n=Number(n);if(!isFinite(n))return '零元整';const i=Math.floor(n),c=Math.round((n-i)*100),j=Math.floor(c/10),f=c%10;let s=intCN(i)+'元';if(!j&&!f)return s+'整';if(j)s+=CN[j]+'角';else if(f)s+='零';if(f)s+=CN[f]+'分';return s;}

// 实时算金额
function recalc(){
  const p=parseFloat(document.getElementById('price').value)||0;
  const q=parseFloat(document.getElementById('qty').value)||0;
  const a=Math.round(p*q*100)/100;
  document.getElementById('amountShow').textContent=fmtNo(a);
  document.getElementById('cnShow').textContent=moneyCN(a);
}
['price','qty'].forEach(id=>document.getElementById(id).addEventListener('input',recalc));

// 提交
function submitNew(){
  const g=id=>document.getElementById(id).value.trim();
  const o={id:uid(),waybill_no:'',created_at:Date.now(),status:'pending',
    carrier:g('carrier'),maker:g('maker'),handler:g('handler'),handlerPhone:g('handlerPhone'),
    driverName:g('driverName'),driverId:g('driverId'),driverPhone:g('driverPhone'),plateNo:g('plateNo'),
    delivery:g('delivery')||'送货上门',
    gname:g('gname'),price:parseFloat(g('price'))||0,qty:parseFloat(g('qty'))||0,
    deliveryTime:g('deliveryTime'),gremark:g('gremark'),gunit:g('gunit')||'（托）',
    customerCount:parseInt(g('customerCount'))||0,shipmentCount:parseInt(g('shipmentCount'))||0,
    rcompany:g('rcompany'),rcontact:g('rcontact'),rphone:g('rphone'),raddress:g('raddress')};
  if(!o.carrier||!o.maker||!o.gname||!o.price||!o.qty||!o.rcompany||!o.rcontact||!o.rphone||!o.raddress){
    alert('请填写所有带 * 的必填项');return;
  }
  o.amount=Math.round(o.price*o.qty*100)/100;
  fetch('/api/waybills',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})
    .then(r=>r.json()).then(s=>{
      applyState(s);
      ['carrier','maker','handler','handlerPhone','driverName','driverId','driverPhone','plateNo','gname','price','qty','deliveryTime','gremark','rcompany','rcontact','rphone','raddress'].forEach(id=>document.getElementById(id).value='');
      recalc();
      document.querySelector('.tab[data-v=list]').click();
      alert('已提交，状态为「待审批」，其他人也能看到。请在列表点「通过」生成托运单。');
    }).catch(()=>alert('提交失败，请检查服务是否运行'));
}

// 生成单号
function ensureNo(o){
  if(o.waybill_no)return;
  const d=new Date(o.created_at);
  const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const same=DATA.filter(x=>x.waybill_no&&x.waybill_no.startsWith('YF'+ymd)).length+1;
  o.waybill_no='YF'+ymd+String(same).padStart(4,'0');
}

// 列表渲染
function renderList(){
  const st=document.getElementById('f-status').value;
  const s=document.getElementById('f-start').value, e=document.getElementById('f-end').value;
  let arr=DATA.filter(o=>{
    if(st!=='all'&&o.status!==st)return false;
    const d=new Date(o.created_at);
    if(s&&d<new Date(s+'T00:00:00'))return false;
    if(e&&d>new Date(e+'T23:59:59'))return false;
    return true;
  });
  const box=document.getElementById('listBox');
  if(!arr.length){box.innerHTML='<div class="empty">暂无符合条件的托运单</div>';return;}
  const BM={pending:['待审批','b-pending'],done:['已通过','b-done'],reject:['已驳回','b-reject']};
  box.innerHTML=arr.map(o=>{
    const b=BM[o.status]||BM.pending;
    let ops=`<button class="btn btn-g" onclick="showPaper('${o.id}')">查看托运单</button>`;
    if(o.status==='pending')ops+=`<button class="btn btn-ok" onclick="approve('${o.id}',1)">通过</button><button class="btn btn-no" onclick="approve('${o.id}',0)">驳回</button>`;
    ops+=`<button class="btn btn-del" onclick="del('${o.id}')">删除</button>`;
    return `<div class="card">
      <div class="row">
        <div><div class="no">${o.waybill_no||'（待生成编号）'}</div>
          <div class="meta">${fmtDate(o.created_at)} · ${esc(o.carrier)} · 制单 ${esc(o.maker||'—')}${o.approver?' · 审批 '+esc(o.approver):''}</div></div>
        <span class="badge ${b[1]}">${b[0]}</span>
      </div>
      <div class="meta" style="margin-top:8px">
        货物 <b>${esc(o.gname)}</b> ${o.qty}吨 × ${o.price}元/吨　
        收货 <b>${esc(o.rcompany)}</b>　
        金额 <b>${fmtNo(o.amount)}</b>
      </div>
      <div class="ops">${ops}</div>
    </div>`;
  }).join('');
}

async function approve(id,ok){
  let approver='';
  if(ok){
    approver=(prompt('审批通过需要署名，请输入你的姓名：')||'').trim();
    if(!approver){alert('未署名，不能批准同意');return;}
  }else{
    if(!confirm('确认驳回？'))return;
  }
  try{
    const r=await fetch('/api/waybills/'+encodeURIComponent(id)+'/approve',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({ok:ok?1:0,approver})});
    const s=await r.json();applyState(s);renderList();
    if(ok){const n=(DATA.find(x=>x.id===id)||{}).waybill_no;alert('已通过，托运单号 '+n+'，审批人：'+approver);}
  }catch(e){alert('操作失败，请检查服务是否运行');}
}
async function del(id){
  if(!confirm('确认删除该记录？'))return;
  try{
    const r=await fetch('/api/waybills/'+encodeURIComponent(id),{method:'DELETE'});
    applyState(await r.json());renderList();
  }catch(e){alert('删除失败，请检查服务是否运行');}
}

// 导出
function filteredForExport(){
  const s=document.getElementById('e-start').value, e=document.getElementById('e-end').value;
  return DATA.filter(o=>{
    if(o.status!=='done')return false;
    const d=new Date(o.created_at);
    if(s&&d<new Date(s+'T00:00:00'))return false;
    if(e&&d>new Date(e+'T23:59:59'))return false;
    return true;
  });
}
function updateExportStat(){
  const a=filteredForExport();
  const sum=a.reduce((s,o)=>s+o.amount,0);
  document.getElementById('exportStat').innerHTML=`已通过单据 <b>${a.length}</b> 张，金额合计 <b>${fmtNo(sum)}</b>（${moneyCN(sum)}）`;
}
function exportCSV(){
  const a=filteredForExport();
  if(!a.length){alert('该时间范围内没有已通过的托运单');return;}
  const head=['单号','生成时间','承运单位','货物名','运费单价(元/吨)','数量(吨)','金额(元)','大写金额','备注','收货单位','联系人','联系电话','收货地址'];
  const rows=a.map(o=>[o.waybill_no,new Date(o.created_at).toLocaleString('zh-CN',{hour12:false}),o.carrier,o.gname,o.price,o.qty,o.amount.toFixed(2),moneyCN(o.amount),o.gremark,o.rcompany,o.rcontact,o.rphone,o.raddress]);
  const csv='\ufeff'+[head,...rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a2=document.createElement('a');
  a2.href=url;a2.download='货运单汇总_'+Date.now()+'.csv';a2.click();URL.revokeObjectURL(url);
}
function exportPrint(){
  const a=filteredForExport();
  if(!a.length){alert('该时间范围内没有已通过的托运单');return;}
  let h='<div class="paper"><h2>货运单汇总表</h2><table class="pt"><tr><th>单号</th><th>日期</th><th>承运</th><th>货物</th><th>数量</th><th>金额</th><th>收货单位</th></tr>';
  a.forEach(o=>h+=`<tr><td>${esc(o.waybill_no)}</td><td>${new Date(o.created_at).toLocaleDateString('zh-CN')}</td><td>${esc(o.carrier)}</td><td>${esc(o.gname)}</td><td>${o.qty}</td><td>${fmtNo(o.amount)}</td><td>${esc(o.rcompany)}</td></tr>`);
  h+='</table></div>';
  document.getElementById('paperBox').innerHTML=h;
  document.getElementById('modal').classList.add('on');
}
